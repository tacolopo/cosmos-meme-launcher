[workspace]
members = [
    "contracts/meme-factory",
    "contracts/meme-token",
    "packages/meme-shared"
]
resolver = "2"

[workspace.dependencies]
cosmwasm-std = "1.5.2"
cosmwasm-storage = "1.5.2"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
cw20 = "1.1.2"
cw20-base = "1.1.2"
schemars = "0.8.16"
serde = { version = "1.0.195", default-features = false, features = ["derive"] }
thiserror = "1.0.56"

[workspace.dependencies.cosmwasm-schema]
version = "1.5.2"

# Dev dependencies
[workspace.dev-dependencies]
cw-multi-test = "0.20.0"

[workspace.dependencies.cw-multi-test]
version = "0.20.0"
