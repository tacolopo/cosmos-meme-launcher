[workspace]
members = [
    "contracts/meme-factory",
    "contracts/meme-token",
    "packages/meme-shared"
]
resolver = "2"

[workspace.dependencies]
cosmwasm-std = "2.0.0"
cosmwasm-storage = "2.0.0"
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
cw20 = "2.0.0"
cw20-base = "2.0.0"
schemars = "0.8.16"
serde = { version = "1.0.195", default-features = false, features = ["derive"] }
thiserror = "1.0.56"

[workspace.dependencies.cosmwasm-schema]
version = "2.0.0"

# Dev dependencies
[workspace.dev-dependencies]
cw-multi-test = "2.0.0"
